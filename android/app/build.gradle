// android/app/build.gradle
// FIX 2 (Gradle debug): the previous revision referenced $androidxMaterialVersion
// and $androidxCoreSplashScreenVersion, but variables.gradle (the real Capacitor 6
// template) defines neither "androidxMaterialVersion" (Material is not a Capacitor
// dependency) nor "androidxCoreSplashScreenVersion" (it is "coreSplashScreenVersion").
// Material dependency removed (restores the standard Capacitor 6 template),
// splash variable name corrected. The androidx.core:core:1.13.1 force is preserved.
// NOTE: save this file as "build.gradle" at android/app/build.gradle
apply plugin: 'com.android.application'

android {
    namespace "com.hoosha.crm"
    compileSdk rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.hoosha.crm"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0.0"
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

// Resolve the androidx.core conflict introduced by the calendar plugin's
// transitive dependency. 1.13.1 is the last androidx.core build that works
// with Android Gradle Plugin 8.x.
configurations.all {
    resolutionStrategy {
        force 'androidx.core:core:1.13.1'
        force 'androidx.core:core-ktx:1.13.1'
    }
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.core:core:1.13.1"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    implementation project(':capacitor-cordova-android-plugins')
}

// ROOT CAUSE FIX (Contacts + Notifications "not implemented on android"):
// android/app/capacitor.build.gradle is generated correctly by "cap sync" and already
// lists every plugin's native Android module (capacitor-community-contacts,
// capacitor-local-notifications, capacitor-app, capacitor-status-bar,
// ebarooni-capacitor-calendar) as a project dependency. But this file is only ever
// picked up if something actually applies it — the standard Capacitor 6 template
// applies it right here. That line was missing, so none of those native plugin
// modules were ever compiled into the app, even though they were correctly
// registered in settings.gradle / capacitor.settings.gradle and present in
// node_modules. The JS side (Capacitor.registerPlugin) then found no native
// PluginHeader at runtime and threw "<Plugin> plugin is not implemented on android" —
// exactly the reported error. This is the standard, non-hacky Capacitor mechanism;
// do not remove it and do not hand-list the plugin dependencies here instead, since
// capacitor.build.gradle is regenerated by "cap sync" on every dependency change.
apply from: "capacitor.build.gradle"